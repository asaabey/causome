name: Publish reviewed root

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  pages: read

concurrency:
  group: scientific-publication
  cancel-in-progress: false

jobs:
  launch-build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Verify immutable registry
        run: node scripts/check-immutability.mjs "$(git rev-parse HEAD^)"
      - run: pnpm test
      - name: Verify authenticated scientific approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm validate:publication
      - name: Require recorded launch acceptance
        run: pnpm validate:launch
      - uses: actions/configure-pages@v6.0.0
        id: pages
      - name: Build approved static release
        env:
          CAUSOME_BUILD_MODE: publication
          CAUSOME_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm --filter @causome/web build
      - name: Install pinned browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Check the actual public artifact
        env:
          CAUSOME_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          CAUSOME_BUILD_MODE: publication
        run: pnpm test:browser
      - name: Measure the actual public artifact
        env:
          CAUSOME_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          CAUSOME_BUILD_MODE: publication
        run: pnpm test:performance
      - name: Archive exact launch artifact
        run: pnpm archive:site
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: immutable-launch
          path: launch-artifacts/
          retention-days: 90
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: launch-verification
          path: |
            playwright-report/
            test-results/
            performance-report/
            performance-test-results/
          retention-days: 90
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web/dist/

  deploy:
    needs: launch-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@v8.0.1
        with:
          name: immutable-launch
          path: launch-artifacts/
      - name: Verify deployed release and fallback
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/health-check.mjs "$PAGE_URL" launch-artifacts/*.archive.json
